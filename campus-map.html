<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

        <style>
        #map { height: 500px;
         }
        .popup-image{
            width:200px;
            height:auto;
             object-fit: fill;
        }
        </style>
    
    </head>
    <body>

        <h1>Campus Map</h1>   
        <div id="map"></div>
    </body>
    <script>

    function initMap(mapDataUrl){
        const map = L.map(`map`).setview([8.3603,124.8684],17);

        //openstreet map
        const openstreetMap =L.tilelayer(`https://tileopenstreetmap.org/{z}/{x}/{y}.png`,{
            maxZoom:19,
            attribution:'&copy; OpenStreetMap contributors'
        })
        
        //Satellite
        const satellite = L.tilelayer(
            `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
                {attrribution: 'Tiles (c) Esri - Source, Maxar, Earthstar Geographics, and the GIS User Community'}
            
        );
 
        openstreetMap.addTo(map);
        console.log("Base map tile layer loaded " +  Date());

        const markerGroups = {};

        fetch(mapDataUrl)
        .then(response => response.json())
        .then(data=>{
            data.forEach(pin=>{
                const type = pin.locationType || 'Other';

                //Create Marker Group
                if (!markerGroups[type]){
                    markerGroups[type] = L.layerGroup().addTo(map);
                }

                //Marker and Popup
                const marker = L.marker([pin.lat, pin.lng]).addTo(map);

                const img = `<img src='${pin.img}' class="popup-image">`; 
                marker.bindPopup(`
                ${img} <br>
                <b>${pin.title}<b>
                ${pin.description}
                ${pin.locationType}
                `);

                    console.log(`${pin.name} Loaded ` + Date());

                    markerGroups[type].addLayer(marker);
            })
            //add marker groups into map according to marker filter
            Object.values(markerGroups).forEach(group=>group.addTo(map));

            //map layer control
            const baseMaps = {
                "OpenStreetMap": openstreetMap,
                "Satellite": satellite
            }

            const overlayMaps={};

            //add marker 'group into the basemap
            Object.keys(markerGroups).forEach(type=>{
                overlayMaps[type]= markerGroups[type];
           
            });
            L.control.layers(baseMaps, overlayMaps,{collapsed:false}).addTo(map);
        })
        .catch(err=>console.error('Error loading JSON:',err));

    }

    document.addEventListener('DOMContentLoaded',()=>{
        initMap('campus-map.json');
    });
</script>
</html>
